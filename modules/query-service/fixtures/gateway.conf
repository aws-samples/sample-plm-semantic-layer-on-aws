# The fixture stack's stand-in for the API Gateway: one path prefix per service, the path passed through unchanged
# (each service answers under its own prefix: /fr/..., /core/..., /query/...). No origin secret: the stack is local.
server {
    listen 8080;
    client_max_body_size 1m;
    # The bill of materials and the interface answers of the large products take tens of seconds on a cold stack.
    proxy_read_timeout 300s;
    location /fr/ { proxy_pass http://plm-fr:8080; }
    location /de/ { proxy_pass http://plm-de:8080; }
    location /uk/ { proxy_pass http://plm-uk:8080; }
    location /es/ { proxy_pass http://plm-es:8080; }
    location /core/ { proxy_pass http://core:8080; }
    location /query/ { proxy_pass http://query:8080; }
    # The deployment's /api prefix, for the smoke test's local mode: /api/fr/... is /fr/... here.
    location /api/ { rewrite ^/api(/.*)$ $1 last; }
}
