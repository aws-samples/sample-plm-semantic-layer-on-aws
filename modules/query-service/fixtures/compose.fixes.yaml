# The services that own the facts, beside the query stack of compose.yaml: the four site PLM services, the Atelier
# core service and a gateway standing in for the API Gateway, so a correction is released in its site's PLM, logged in
# Atelier's change log and undone by the officer's reset as on the deployment. Used as
#   finch compose -p <project> -f compose.yaml -f compose.fixes.yaml
# by fixes.sh. Each service runs its jar (built from modules/plm-services) in the JRE image the service Dockerfile
# pins. The fixture SQL already holds the schema and the seed, so Flyway does not run. No EventBridge here: an event
# is skipped, and the cycle posts the change rows to /core/changes as the links loader does.
x-service: &service
  image: public.ecr.aws/docker/library/eclipse-temurin:21-jre-alpine@sha256:51ab5e3302e7141ce665ca3ea85e8b5cd648eafbc3c0c90dd79d6537684e4555
  depends_on: [pg]
  command: [java, -XX:+UseSerialGC, -Xss512k, -jar, /app/app.jar]
x-db: &db
  DB_HOST: pg
  DB_USER: postgres
  DB_PASSWORD: fixture # pragma: allowlist secret
  SPRING_FLYWAY_ENABLED: "false"
  ATELIER_POLICY_FILE: /app/policy.json
  # The read-only connection to atelier_core the PLM services read the export-control tags through, as deployed.
  CORE_DB_HOST: pg
  CORE_DB_USER: postgres
  CORE_DB_PASSWORD: fixture # pragma: allowlist secret
  CORE_DB_NAME: atelier_core
x-policy: &policy ../../../ontology/policy.json:/app/policy.json:ro
services:
  plm-fr:
    <<: *service
    environment: { <<: *db, DB_NAME: fr_plm }
    volumes: [../../plm-services/plm-fr/target/plm-fr.jar:/app/app.jar:ro, *policy]
  plm-de:
    <<: *service
    environment: { <<: *db, DB_NAME: de_plm }
    volumes: [../../plm-services/plm-de/target/plm-de.jar:/app/app.jar:ro, *policy]
  plm-uk:
    <<: *service
    environment: { <<: *db, DB_NAME: uk_plm }
    volumes: [../../plm-services/plm-uk/target/plm-uk.jar:/app/app.jar:ro, *policy]
  plm-es:
    <<: *service
    environment: { <<: *db, DB_NAME: es_plm }
    volumes: [../../plm-services/plm-es/target/plm-es.jar:/app/app.jar:ro, *policy]
  core:
    <<: *service
    depends_on: [pg, links]
    environment:
      <<: *db
      DB_NAME: atelier_core
      NEPTUNE_SPARQL_URL: http://links:7878/query
      NEPTUNE_GSP_URL: http://links:7878/store
      RELEASED_GRAPHS_DIR: /app/data
      # The reset undoes each logged correction through the gateway, as the deployment's core service does through
      # the API Gateway.
      PLM_API_BASE: http://gateway:8080
    volumes:
      - ../../plm-services/atelier-core/target/atelier-core.jar:/app/app.jar:ro
      - *policy
      - ./generated/links.ttl:/app/data/links.ttl:ro
      - ./generated/fileindex.ttl:/app/data/fileindex.ttl:ro
      - ./generated/labels.ttl:/app/data/labels.ttl:ro
  query:
    environment:
      # The change list reads the core service's log through the gateway.
      PLM_API_BASE: http://gateway:8080
  gateway:
    image: public.ecr.aws/docker/library/nginx:1.29.8-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    depends_on: [plm-fr, plm-de, plm-uk, plm-es, core, query]
    volumes: [./gateway.conf:/etc/nginx/conf.d/default.conf:ro]
    ports: ["127.0.0.1:${GATEWAY_PORT:-18590}:8080"]
