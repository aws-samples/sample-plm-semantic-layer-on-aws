server.port=8080
spring.application.name=atelier-query-service
spring.main.banner-mode=off
# Inputs of the Ontop reformulators, one per source (fr, de, uk, es, core); the image copies them from modules/ontop/ and ontology/.
atelier.ontop.mappings-dir=/app/mappings
atelier.ontop.ontology=/app/ontology/atelier.ttl
atelier.ontop.metadata-dir=/app/metadata
# Export-control policy (ontology/policy.json); the image sets ATELIER_POLICY_FILE=/app/policy.json.
atelier.policy.file=../../ontology/policy.json
# Every SPARQL request (Ontop endpoints, link store) has a connect timeout and a timeout until the endpoint's answer begins;
# an endpoint that exceeds either fails the request as an unreachable endpoint does (502 naming the endpoint).
# Env: ATELIER_SPARQL_CONNECT_TIMEOUT, ATELIER_SPARQL_TIMEOUT.
atelier.sparql.connect-timeout=5s
atelier.sparql.timeout=30s
# Once every SPARQL endpoint answers, the full answer runs once per profile so each Ontop endpoint has translated
# its request texts before a client asks; GET /query/health/warmup reports the outcome.
atelier.warmup.enabled=true
# The MCP server listens at /query/mcp (streamable HTTP). Its catalogue and sql tools call the PLM services through the
# API Gateway at PLM_API_BASE with the origin secret from ORIGIN_SECRET or, when ORIGIN_SECRET_ARN is set, Secrets
# Manager; with PLM_API_BASE unset (local runs) those two tools report themselves unavailable.
# The change list at GET /query/demo/changes reads the core service's change log through PLM_API_BASE as well, and
# diffs the live link store (read through NEPTUNE_SPARQL_URL) against the released links.ttl and fileindex.ttl in
# RELEASED_GRAPHS_DIR (the image sets /app/data). The query service writes to no store: the demo's writes (value
# correction, link, CAD publication, reset) are the PLM and core services' own routes, called by the browser directly.
